<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Accounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>My Cards</h2>
            <p class="fs-4 text-success">Total: ₹<span th:text="${totalBalance}">0</span></p>
        </div>
        <a th:href="@{/accounts/new}" class="btn btn-primary btn-lg">+ Add Card</a>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="acc : ${accounts}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <a th:href="@{/accounts/{id}(id=${acc.id})}" style="text-decoration:none; color:inherit;">
                    <h5 class="card-title" th:text="${acc.name}">Card Name</h5></a>
                    <p class="card-text fs-4" th:text="'₹' + ${acc.balance}">Balance</p>
                    <p class="card-text text-muted small" th:if="${acc.note}" th:text="${acc.note}">Note</p>
                    <p class="card-text text-muted small" th:text="${#temporals.format(acc.createdAt, 'dd-MM-yyyy HH:mm')}">Created</p>
                    <a th:href="@{/accounts/edit/{id}(id=${acc.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                    <a th:href="@{/accounts/delete/{id}(id=${acc.id})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Delete this card?')">Delete</a>
                </div>
            </div>
        </div>
        <div th:if="${accounts.isEmpty()}" class="text-muted">
            No cards yet — click "+ Add Card" to create your first one.
        </div>
    </div>
</div>
</body>
</html>
