<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h2>Dashboard</h2>
    <p class="fs-4 text-danger">Total Spent: ₹<span th:text="${totalSpent}">0</span></p>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card p-3">
                <h5>Weekly Spending</h5>
                <canvas id="weeklyChart"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card p-3">
                <h5>Monthly Spending</h5>
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card p-3">
                <h5>By Category</h5>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const weeklyLabels = /*[[${weeklyLabels}]]*/ [];
    const weeklyData = /*[[${weeklyData}]]*/ [];
    const monthlyLabels = /*[[${monthlyLabels}]]*/ [];
    const monthlyData = /*[[${monthlyData}]]*/ [];
    const categoryLabels = /*[[${categoryLabels}]]*/ [];
    const categoryData = /*[[${categoryData}]]*/ [];

    new Chart(document.getElementById('weeklyChart'), {
        type: 'bar',
        data: {
            labels: weeklyLabels,
            datasets: [{ label: 'Spent (₹)', data: weeklyData, backgroundColor: '#0d6efd' }]
        }
    });

    new Chart(document.getElementById('monthlyChart'), {
        type: 'line',
        data: {
            labels: monthlyLabels,
            datasets: [{ label: 'Spent (₹)', data: monthlyData, borderColor: '#198754', fill: false }]
        }
    });

    new Chart(document.getElementById('categoryChart'), {
        type: 'pie',
        data: {
            labels: categoryLabels,
            datasets: [{ data: categoryData, backgroundColor: ['#0d6efd','#dc3545','#198754','#ffc107','#6f42c1','#20c997'] }]
        }
    });
</script>
</body>
</html>
