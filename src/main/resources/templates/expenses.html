<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expenses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Expenses</h2>
        <a th:href="@{/expenses/new}" class="btn btn-primary btn-lg">+ Add Expense</a>
    </div>

    <table class="table table-bordered bg-white">
        <thead>
            <tr>
                <th>Date/Time</th>
                <th>Account</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Note</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="exp : ${expenses}">
                <td th:text="${#temporals.format(exp.dateTime, 'dd-MM-yyyy HH:mm')}">Date</td>
                <td th:text="${exp.account.name}">Account</td>
                <td th:text="${exp.category}">Category</td>
                <td th:text="'₹' + ${exp.amount}">Amount</td>
                <td th:text="${exp.note}">Note</td>
                <td>
                    <a th:href="@{/expenses/delete/{id}(id=${exp.id})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Delete this expense?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:if="${expenses.isEmpty()}" class="text-muted">No expenses yet.</div>
</div>
</body>
</html>
