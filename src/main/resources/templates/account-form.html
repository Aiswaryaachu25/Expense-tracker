<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2>Add / Edit Card</h2>
    <form th:action="@{/accounts/save}" th:object="${account}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label class="form-label">Card Name (e.g. Bank, Purse, Bag)</label>
            <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. Purse" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Starting Balance</label>
            <input type="number" step="0.01" class="form-control" th:field="*{balance}" required>
        </div>
        <div class="mb-3">
    <label class="form-label">Note (optional)</label>
    <input type="text" class="form-control" th:field="*{note}" placeholder="e.g. Main savings account">
</div>
        <button type="submit" class="btn btn-success">Save Card</button>
        <a th:href="@{/accounts}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
