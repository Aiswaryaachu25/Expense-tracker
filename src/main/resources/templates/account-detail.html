<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Card Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <a th:href="@{/accounts}" class="btn btn-secondary btn-sm mb-3">&larr; Back to Cards</a>
    <h2 th:text="${account.name}">Card Name</h2>
    <p class="fs-3 text-success">Balance: ₹<span th:text="${account.balance}">0</span></p>

   <div class="card p-3 mb-4">
    <h5>Add / Subtract Money</h5>
    <form th:action="@{/accounts/{accountId}/add-money(accountId=${account.id})}" th:object="${transaction}" method="post">
        <div class="mb-2">
            <select th:field="*{type}" class="form-select">
                <option value="ADD">Add Money (+)</option>
                <option value="SUBTRACT">Subtract Money (-)</option>
            </select>
        </div>
        <div class="mb-2">
            <input type="number" step="0.01" class="form-control" th:field="*{amount}" placeholder="Amount" required>
        </div>
        <div class="mb-2">
            <input type="text" class="form-control" th:field="*{note}" placeholder="Note (optional)">
        </div>
        <button type="submit" class="btn btn-success">Submit</button>
    </form>
</div>

    <h5>History</h5>
    <table class="table table-bordered bg-white">
        <thead>
            <tr><th>Date/Time</th><th>Amount</th><th>Note</th></tr>
        </thead>
        <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${#temporals.format(t.dateTime, 'dd-MM-yyyy HH:mm')}">Date</td>
                <td th:class="${t.type == 'SUBTRACT'} ? 'text-danger' : 'text-success'"
                th:text="(${t.type == 'SUBTRACT'} ? '- ₹' : '+ ₹') + ${t.amount}">Amount</td>
                <td th:text="${t.note}">Note</td>
            </tr>
        </tbody>
    </table>
    <div th:if="${transactions.isEmpty()}" class="text-muted">No transactions yet.</div>
</div>
</body>
</html>
